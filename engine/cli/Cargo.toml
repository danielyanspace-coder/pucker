[package]
name = "pucker-cli"
description = "Command line runner for the Pucker packing engine"
version.workspace = true
edition.workspace = true

[[bin]]
name = "pucker"
path = "src/main.rs"

[dependencies]
pucker-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.36"
clap = { version = "4", features = ["derive"] }
